<text x="470.0" y="164.0" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">FPS = 1000 / 평균 ms</text>
<text x="470.0" y="184.0" font-size="12" fill="#0284c7" text-anchor="start">   = 1000 / 16 = 62.5</text>
<text x="470.0" y="212.0" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">실시간 판단은 p95 —</text>
<text x="470.0" y="232.0" font-size="12" fill="#dc2626" text-anchor="start">10 FPS 면 p95 &lt; 100 ms</text>
