<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="250" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Depthwise Separable — 공간 섞기와 채널 섞기를 둘로 쪼갠다 (64 → 128, 3 × 3)</text>
<text x="120.0" y="52.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">일반 3 × 3</text>
<rect x="40.0" y="84.0" width="60.0" height="60.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<rect x="50.0" y="78.0" width="60.0" height="60.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<rect x="60.0" y="72.0" width="60.0" height="60.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<rect x="70.0" y="66.0" width="60.0" height="60.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="150.0" y="100.0" font-size="12.5" fill="#1e293b" text-anchor="start">× 128 필터</text>
<text x="120.0" y="160.0" font-size="12" fill="#64748b" text-anchor="middle">필터 하나가 64채널 × 3×3</text>
<text x="120.0" y="180.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">128·64·9 = 73,728</text>
<text x="470.0" y="52.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">DS = depthwise → pointwise</text>
<rect x="290.0" y="70.0" width="18.0" height="60.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="312.0" y="70.0" width="18.0" height="60.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="334.0" y="70.0" width="18.0" height="60.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="356.0" y="70.0" width="18.0" height="60.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<text x="345.0" y="150.0" font-size="12" fill="#1e293b" text-anchor="middle">dw: 채널마다 3×3</text>
<text x="345.0" y="168.0" font-size="12" fill="#64748b" text-anchor="middle">(groups = 64) 64·9 = 576</text>
<line x1="395.0" y1="100.0" x2="440.0" y2="100.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="455.0" y="76.0" width="40.0" height="40.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<rect x="465.0" y="70.0" width="40.0" height="40.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<rect x="475.0" y="64.0" width="40.0" height="40.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<rect x="485.0" y="58.0" width="40.0" height="40.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="500.0" y="150.0" font-size="12" fill="#1e293b" text-anchor="middle">pw: 1×1 × 128</text>
<text x="500.0" y="168.0" font-size="12" fill="#64748b" text-anchor="middle">(채널만) 64·128 = 8,192</text>
<text x="625.0" y="100.0" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700">8,768</text>
<text x="625.0" y="120.0" font-size="12" fill="#64748b" text-anchor="middle">(11.9%)</text>
<text x="350.0" y="210.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">DS / 일반 = 1/Cout + 1/K² = 1/128 + 1/9 = 0.1189 — MAC 75,497,472 → 8,978,432 (32 × 32)</text>
<text x="350.0" y="234.0" font-size="12" fill="#dc2626" text-anchor="middle">실제 속도는 덜 빨라진다: MAC 8.4배 ↓ → 실측 4.1배 (depthwise 는 계산 대비 메모리 이동이 많다)</text>
</svg>
