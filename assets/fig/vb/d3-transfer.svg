<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="240" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">전이학습 — ImageNet 으로 배운 특징 추출기는 가져오고, 분류기 마지막 층만 교체</text>
<rect x="20.0" y="50.0" width="370.0" height="110.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="205.0" y="80.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">features (927,008)</text>
<text x="205.0" y="104.0" font-size="12.5" fill="#64748b" text-anchor="middle">에지 · 질감 · 모양 — 일반 특징</text>
<text x="205.0" y="132.0" font-size="12.5" fill="#0284c7" text-anchor="middle" font-weight="700">❄ 동결 = feature extraction</text>
<text x="205.0" y="150.0" font-size="12" fill="#64748b" text-anchor="middle">같이 학습 = fine-tuning (작은 lr)</text>
<line x1="392.0" y1="105.0" x2="420.0" y2="105.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="425.0" y="50.0" width="255.0" height="110.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="552.0" y="76.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">classifier (601,098)</text>
<text x="552.0" y="98.0" font-size="12" fill="#64748b" text-anchor="middle">576→1024 · Hardswish · Dropout</text>
<text x="552.0" y="122.0" font-size="12.5" fill="#64748b" text-anchor="middle">[3] Linear(1024, 1000)</text>
<line x1="480.0" y1="118.0" x2="625.0" y2="118.0" stroke="#dc2626" stroke-width="1.5"/>
<text x="552.0" y="146.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">→ Linear(1024, 10)</text>
<text x="350.0" y="188.0" font-size="12.5" fill="#1e293b" text-anchor="middle">전체 2,542,856 − 1,025,000 + 10,250 = 1,528,106 · 같은 1 epoch (실행 예):</text>
<text x="350.0" y="210.0" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">feature extraction 0.6607 · fine-tuning 0.8273 · 처음부터 0.5470</text>
<text x="350.0" y="232.0" font-size="12" fill="#dc2626" text-anchor="middle">전처리는 사전학습 때와 같게 — ImageNet mean · std, 입력 32 → 96</text>
</svg>
