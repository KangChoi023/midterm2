<text x="20.0" y="160.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">export 인자</text>
<text x="20.0" y="180.0" font-size="11.5" fill="#1e293b" text-anchor="start">예시 입력 (1, 3, 224, 224) · input_names=["input"] · output_names=["logits"]</text>
<text x="20.0" y="198.0" font-size="11.5" fill="#1e293b" text-anchor="start">dynamic_axes={"input": {0: "batch"}} — 빼면 배치 1 로 굳음 · opset_version=17</text>
<text x="20.0" y="224.0" font-size="11.5" fill="#64748b" text-anchor="start">MobileNetV3-S: 노드 159개 (HardSwish 포함) · 파일 10.18 MB ≈ 파라미터 2,542,856 × 4 B</text>
<text x="20.0" y="242.0" font-size="11.5" fill="#16a34a" text-anchor="start">배치 4 비교: 출력 (4, 1000), PyTorch 와 최대 차이 1.48e-05 &lt; 1e-4 ✔ · YOLOv8n ONNX: 7명 = 7명, 짝 IoU 1.0</text>
