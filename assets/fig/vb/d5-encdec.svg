<text x="540.0" y="152.0" font-size="12" fill="#1e293b" text-anchor="start">Transposed Conv: 학습 O</text>
<text x="540.0" y="180.0" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">출력 = (n−1)·s − 2p + k</text>
<text x="540.0" y="202.0" font-size="11.5" fill="#64748b" text-anchor="start">n=8, k4 s2 p1 → 16</text>
