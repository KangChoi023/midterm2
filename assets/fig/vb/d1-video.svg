<text x="350.0" y="170.0" font-size="12.5" fill="#1e293b" text-anchor="middle">프레임 하나 = (120, 320, 3) uint8 BGR = 115,200 byte → 압축 없이 180장이면 약 20.7 MB → 코덱(mp4v)</text>
<text x="350.0" y="194.0" font-size="12.5" fill="#64748b" text-anchor="middle">i % 30 == 15 인 프레임(15, 45, …, 165)에서 숫자가 창 가운데 — 가운데 120 × 120 을 28 × 28 로 줄여 모델에</text>
<text x="350.0" y="218.0" font-size="12.5" fill="#0284c7" text-anchor="middle" font-weight="700">VideoCapture → read() → (처리 · 추론) → VideoWriter.write() → release()</text>
