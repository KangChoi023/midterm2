<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="270" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">letterbox — 비율을 지켜 긴 변을 640 으로, 남는 곳은 회색(114)</text>
<rect x="40.0" y="50.0" width="156.5" height="150.1" rx="0" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="118.3" y="125.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">559 × 536</text>
<text x="118.3" y="218.1" font-size="12" fill="#64748b" text-anchor="middle">원본</text>
<line x1="210.0" y1="125.0" x2="260.0" y2="125.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="235.0" y="117.0" font-size="12" fill="#64748b" text-anchor="middle">r = 1.1449</text>
<rect x="280.0" y="40.0" width="179.2" height="179.2" rx="0" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="280.0" y="43.6" width="179.2" height="171.9" rx="0" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="369.6" y="129.6" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">640 × 614</text>
<text x="467.2" y="46.0" font-size="11.5" fill="#64748b" text-anchor="start">위 패딩 13</text>
<text x="467.2" y="219.2" font-size="11.5" fill="#64748b" text-anchor="start">아래 패딩 13</text>
<text x="369.6" y="237.2" font-size="12" fill="#64748b" text-anchor="middle">640 × 640 (회색 114)</text>
<text x="530.0" y="90.0" font-size="12.5" fill="#1e293b" text-anchor="start">r = min(640/536, 640/559)</text>
<text x="530.0" y="112.0" font-size="12.5" fill="#0284c7" text-anchor="start">   = 1.1449</text>
<text x="530.0" y="140.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">되돌리기 (박스 → 원본)</text>
<text x="530.0" y="162.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">(박스 − 패딩) ÷ r</text>
<text x="350.0" y="260.0" font-size="11.5" fill="#64748b" text-anchor="middle">이어서 BGR→RGB · 0~1 · (1, 3, 640, 640) — 출력 (1, 84, 8400) 을 전치 · 필터 · NMS 한 뒤 원본 좌표로</text>
</svg>
