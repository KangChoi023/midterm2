<text x="30.0" y="200.0" font-size="11.5" fill="#64748b" text-anchor="start">초록 = 둘 다 사람(8) · 빨강 = 예측만 사람(4) · 회색 = 둘 다 배경(4)</text>
<text x="480.0" y="70.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">사람 IoU = 8 / 12</text>
<text x="610.0" y="70.0" font-size="13" fill="#0284c7" text-anchor="start" font-weight="700">= 0.6667</text>
<text x="480.0" y="96.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">배경 IoU = 4 / 8</text>
<text x="610.0" y="96.0" font-size="13" fill="#0284c7" text-anchor="start" font-weight="700">= 0.5</text>
<text x="480.0" y="126.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="700">mIoU = 평균 = 0.5833</text>
<text x="480.0" y="154.0" font-size="11.5" fill="#64748b" text-anchor="start">교집합 = 둘 다 그 클래스</text>
<text x="480.0" y="172.0" font-size="11.5" fill="#64748b" text-anchor="start">합집합 = 하나라도 그 클래스</text>
<text x="350.0" y="232.0" font-size="12" fill="#1e293b" text-anchor="middle">데이터 전체는 장마다 IoU 를 평균하지 말고, 클래스별 교집합 · 합집합 픽셀 수를 누적한 뒤 나눈다</text>
