<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="250" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">YOLOv8 — 640×640 입력, stride 3가지에서 한 번에 예측 → 8,400 칸</text>
<rect x="20.0" y="40.0" width="100.0" height="60.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="70.0" y="67.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">입력</text>
<text x="70.0" y="85.0" font-size="12.5" fill="#64748b" text-anchor="middle">640×640×3</text>
<rect x="150.0" y="40.0" width="110.0" height="60.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="67.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Backbone</text>
<text x="205.0" y="85.0" font-size="12.5" fill="#64748b" text-anchor="middle">CSP</text>
<rect x="290.0" y="40.0" width="110.0" height="60.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="345.0" y="67.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Neck</text>
<text x="345.0" y="85.0" font-size="12.5" fill="#64748b" text-anchor="middle">FPN + PAN</text>
<rect x="430.0" y="40.0" width="120.0" height="60.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="490.0" y="67.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Head</text>
<text x="490.0" y="85.0" font-size="12.5" fill="#64748b" text-anchor="middle">anchor-free</text>
<rect x="580.0" y="40.0" width="100.0" height="60.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="630.0" y="67.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">출력</text>
<text x="630.0" y="85.0" font-size="12.5" fill="#64748b" text-anchor="middle">(1, 84, 8400)</text>
<line x1="120.0" y1="70.0" x2="150.0" y2="70.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="260.0" y1="70.0" x2="290.0" y2="70.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="400.0" y1="70.0" x2="430.0" y2="70.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="550.0" y1="70.0" x2="580.0" y2="70.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="95.0" y="146.0" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">stride 8</text>
<rect x="105.0" y="130.0" width="176.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="291.0" y="146.0" font-size="12.5" fill="#1e293b" text-anchor="start">80×80 = 6,400 칸</text>
<text x="95.0" y="178.0" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">stride 16</text>
<rect x="105.0" y="162.0" width="88.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="203.0" y="178.0" font-size="12.5" fill="#1e293b" text-anchor="start">40×40 = 1,600 칸</text>
<text x="95.0" y="210.0" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">stride 32</text>
<rect x="105.0" y="194.0" width="44.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="159.0" y="210.0" font-size="12.5" fill="#1e293b" text-anchor="start">20×20 = 400 칸</text>
<text x="560.0" y="160.0" font-size="13" fill="#1e293b" text-anchor="middle">6,400 + 1,600 + 400</text>
<text x="560.0" y="184.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">= 8,400</text>
<text x="350.0" y="240.0" font-size="12" fill="#64748b" text-anchor="middle">84 = 박스 4 (cx cy w h) + 클래스 80 (sigmoid 점수)</text>
</svg>
