<text x="423.0" y="165.0" font-size="12.5" fill="#1e293b" text-anchor="middle">2층 출력 1칸</text>
<text x="470.0" y="70.0" font-size="13" fill="#1e293b" text-anchor="start">rf ← rf + (K − 1) · jump</text>
<text x="470.0" y="92.0" font-size="13" fill="#1e293b" text-anchor="start">jump ← jump · S</text>
<text x="470.0" y="122.0" font-size="13" fill="#0284c7" text-anchor="start" font-weight="700">1 → 1 + 2 = 3 → 3 + 2 = 5</text>
<text x="470.0" y="144.0" font-size="12.5" fill="#64748b" text-anchor="start">3 × 3 세 층 = 7 × 7</text>
<text x="470.0" y="166.0" font-size="12.5" fill="#64748b" text-anchor="start">풀링 · stride 뒤엔 jump 가 커져</text>
<text x="470.0" y="184.0" font-size="12.5" fill="#64748b" text-anchor="start">같은 3 × 3 이 더 넓게 퍼진다</text>
<text x="350.0" y="236.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">파라미터: 5 × 5 한 층 25C² vs 3 × 3 두 층 18C² (28% 적다) — 게다가 ReLU 가 두 번</text>
