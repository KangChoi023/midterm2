<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="210" fill="#fff"/>
<rect x="10.0" y="50.0" width="100.0" height="64.0" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="60.0" y="79.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">배치 → device</text>
<text x="60.0" y="97.0" font-size="12.5" fill="#64748b" text-anchor="middle">xb.to(device)</text>
<line x1="110.0" y1="82.0" x2="123.0" y2="82.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="125.0" y="50.0" width="100.0" height="64.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="175.0" y="79.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">순전파</text>
<text x="175.0" y="97.0" font-size="12.5" fill="#64748b" text-anchor="middle">model(xb)</text>
<line x1="225.0" y1="82.0" x2="238.0" y2="82.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="240.0" y="50.0" width="100.0" height="64.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="290.0" y="79.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">손실</text>
<text x="290.0" y="97.0" font-size="12.5" fill="#64748b" text-anchor="middle">loss_fn(…, yb)</text>
<line x1="340.0" y1="82.0" x2="353.0" y2="82.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="355.0" y="50.0" width="100.0" height="64.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="405.0" y="79.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">기울기 비우기</text>
<text x="405.0" y="97.0" font-size="12.5" fill="#64748b" text-anchor="middle">opt.zero_grad()</text>
<line x1="455.0" y1="82.0" x2="468.0" y2="82.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="470.0" y="50.0" width="100.0" height="64.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="520.0" y="79.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">역전파</text>
<text x="520.0" y="97.0" font-size="12.5" fill="#64748b" text-anchor="middle">loss.backward()</text>
<line x1="570.0" y1="82.0" x2="583.0" y2="82.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="585.0" y="50.0" width="100.0" height="64.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="635.0" y="79.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">갱신</text>
<text x="635.0" y="97.0" font-size="12.5" fill="#64748b" text-anchor="middle">opt.step()</text>
<polyline points="660.0,118.0 660.0,150.0 60.0,150.0 60.0,120.0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" stroke-linejoin="round"/>
<text x="360.0" y="168.0" font-size="12.5" fill="#64748b" text-anchor="middle">for xb, yb in loader: — 배치마다 반복, 한 바퀴 = 1 epoch</text>
<text x="350.0" y="26.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">학습 한 step — 모델이 ResNet 이든 YOLO 든 이 모양 그대로</text>
<text x="350.0" y="196.0" font-size="12.5" fill="#64748b" text-anchor="middle">NN 과정의 net.gradient(x, t) + optimizer.update(params, grads) 가 zero_grad · backward · step 세 줄로</text>
</svg>
