<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="230" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Residual block — y = ReLU(F(x) + x), 층은 "바꿀 양" F 만 배운다</text>
<rect x="20.0" y="90.0" width="60.0" height="44.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="50.0" y="117.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">x</text>
<rect x="120.0" y="90.0" width="150.0" height="44.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="195.0" y="117.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Conv-BN-ReLU</text>
<rect x="300.0" y="90.0" width="110.0" height="44.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="355.0" y="117.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Conv-BN</text>
<circle cx="460.0" cy="112.0" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="460.0" y="118.0" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">+</text>
<rect x="510.0" y="90.0" width="80.0" height="44.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="550.0" y="117.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">ReLU</text>
<rect x="620.0" y="90.0" width="60.0" height="44.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="650.0" y="117.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">y</text>
<line x1="80.0" y1="112.0" x2="118.0" y2="112.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="270.0" y1="112.0" x2="298.0" y2="112.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="410.0" y1="112.0" x2="440.0" y2="112.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="478.0" y1="112.0" x2="508.0" y2="112.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="590.0" y1="112.0" x2="618.0" y2="112.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="50.0,90.0 50.0,56.0 460.0,56.0 460.0,92.0" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round"/>
<text x="255.0" y="48.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">지름길 (모양이 같으면 Identity, 다르면 1×1 Conv stride 2 + BN)</text>
<text x="265.0" y="160.0" font-size="12.5" fill="#d97706" text-anchor="middle">F(x) — 잔차</text>
<text x="350.0" y="192.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">역전파: ∂y/∂x = F′(x) + 1 — F′ 가 아무리 작아도 1 이 남아 입력까지 기울기가 흐른다</text>
<text x="350.0" y="216.0" font-size="12.5" fill="#64748b" text-anchor="middle">바꿀 게 없으면 F = 0 을 배우면 된다 (y = x) — plain 망이 어려워하던 "아무것도 안 하기" 가 쉬워진다</text>
</svg>
