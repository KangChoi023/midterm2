<text x="640.0" y="190.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">255</text>
<text x="213.0" y="120.0" font-size="11.5" fill="#dc2626" text-anchor="start">0.0 → zp 칸 (정확히)</text>
<text x="60.0" y="218.0" font-size="12" fill="#1e293b" text-anchor="start">quantize: q = clip(round(x / scale) + zp, 0, 255)</text>
<text x="400.0" y="218.0" font-size="12" fill="#1e293b" text-anchor="start">dequantize: x̂ = (q − zp) × scale</text>
<text x="60.0" y="238.0" font-size="12" fill="#64748b" text-anchor="start">범위 안: |오차| ≤ scale/2 = 0.00784   ·   범위 밖 4.0 → 255 → 2.996 (잘림 오차 1.004)</text>
