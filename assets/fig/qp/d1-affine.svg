<text x="205.6" y="190.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">64</text>
<line x1="277.5" y1="74.0" x2="278.4" y2="166.0" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arr)"/>
