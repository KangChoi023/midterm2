<line x1="405.0" y1="93.0" x2="438.0" y2="93.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="20.0" y="152.0" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">Static</text>
