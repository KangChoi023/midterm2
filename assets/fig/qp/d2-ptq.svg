<text x="95.0" y="184.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">rn20_pre.onnx</text>
<text x="95.0" y="202.0" font-size="12.5" fill="#64748b" text-anchor="middle">+ 보정 500장</text>
<rect x="205.0" y="162.0" width="200.0" height="50.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="305.0" y="184.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">quantize_static</text>
<text x="305.0" y="202.0" font-size="12.5" fill="#64748b" text-anchor="middle">CalibrationDataReader</text>
<rect x="440.0" y="162.0" width="240.0" height="50.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="560.0" y="184.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">활성값 scale · zp 를 파일에</text>
