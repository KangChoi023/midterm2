<text x="305.0" y="90.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">quantize_dynamic</text>
<text x="305.0" y="108.0" font-size="12.5" fill="#64748b" text-anchor="middle">weight 만 미리 INT8</text>
<rect x="440.0" y="68.0" width="240.0" height="50.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="560.0" y="90.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">실행할 때마다 입력 min · max</text>
<text x="560.0" y="108.0" font-size="12.5" fill="#64748b" text-anchor="middle">→ 그때 scale 계산 (보정 X)</text>
