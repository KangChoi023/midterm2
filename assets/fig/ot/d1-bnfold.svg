<text x="20.0" y="160.0" font-size="11.5" fill="#1e293b" text-anchor="start">Conv* = BN 을 접어 넣은 Conv: W′ = W · γ/√(σ²+ε), b′ = (b − μ) · γ/√(σ²+ε) + β — 실행 모드에선 BN 이 고정된 곱셈 · 덧셈</text>
<text x="20.0" y="182.0" font-size="11.5" fill="#1e293b" text-anchor="start">노드 11 → 9 · 파라미터 1,491 (BN 48개 포함) · safety.onnx 7,502 B · 난수 10개 최대 차이 8.20e-08</text>
<text x="20.0" y="206.0" font-size="11.5" fill="#dc2626" text-anchor="start">⚠ export 전에 safety.eval() — 학습 모드면 BN 이 배치 통계를 써서 PyTorch 기준값이 달라진다</text>
