<text x="20.0" y="252.0" font-size="11" fill="#1e293b" text-anchor="start">신경망은 값이 작고 결과를 argmax 로 보므로 끝자리 오차에 강하다 — T4 Tensor Core 가 FP16 을 훨씬 빨리 계산</text>
<text x="20.0" y="270.0" font-size="11" fill="#64748b" text-anchor="start">엔진의 입출력은 FP32 그대로 (안쪽 계산만 FP16) — 입력을 float16 으로 바꿔 넣지 않는다</text>
