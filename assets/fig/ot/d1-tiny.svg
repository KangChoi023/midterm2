<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="270" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">nn.Linear(3, 2) → ONNX 노드 하나 (Gemm) — y = x·Wᵀ + b</text>
<rect x="20.0" y="95.0" width="110.0" height="40.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="75.0" y="112.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">input</text>
<text x="75.0" y="127.0" font-size="11" fill="#64748b" text-anchor="middle">float32[1, 3]</text>
<rect x="200.0" y="64.0" width="150.0" height="102.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="275.0" y="88.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Gemm</text>
<text x="275.0" y="106.0" font-size="11" fill="#64748b" text-anchor="middle">transB = 1</text>
<text x="275.0" y="132.0" font-size="11.5" fill="#d97706" text-anchor="middle">B ⟨2×3⟩ = weight</text>
<text x="275.0" y="152.0" font-size="11.5" fill="#d97706" text-anchor="middle">C ⟨2⟩ = bias</text>
<rect x="420.0" y="95.0" width="110.0" height="40.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="475.0" y="112.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">output</text>
<text x="475.0" y="127.0" font-size="11" fill="#64748b" text-anchor="middle">float32[1, 2]</text>
<line x1="130.0" y1="115.0" x2="198.0" y2="115.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="350.0" y1="115.0" x2="418.0" y2="115.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="560.0" y="80.0" font-size="12.5" fill="#1e293b" text-anchor="start">W = [[1, 2, 3],</text>
<text x="560.0" y="98.0" font-size="12.5" fill="#1e293b" text-anchor="start">      [0, −1, 1]]</text>
<text x="560.0" y="118.0" font-size="12.5" fill="#1e293b" text-anchor="start">b = [0.5, −0.5]</text>
<text x="560.0" y="146.0" font-size="12.5" fill="#1e293b" text-anchor="start">x = [1, 1, 1] →</text>
<text x="560.0" y="164.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">[6.5, −0.5]</text>
<text x="20.0" y="200.0" font-size="12" fill="#1e293b" text-anchor="start">export = 더미 입력 (1, 3) 으로 한 번 실행하며 지나간 연산을 녹화 — 값은 상관없고 shape · dtype 이 중요</text>
<text x="20.0" y="222.0" font-size="12" fill="#1e293b" text-anchor="start">파일 크기: 파라미터 8개 × 4 B = 32 B + 그래프 · 이름 · 버전 217 B = tiny.onnx 249 B</text>
<text x="20.0" y="244.0" font-size="12" fill="#64748b" text-anchor="start">weight 는 (출력 2, 입력 3) 으로 저장 → Gemm 이 transB = 1 로 전치해서 곱한다</text>
</svg>
