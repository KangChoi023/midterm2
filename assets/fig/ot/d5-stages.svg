<rect x="206.6" y="126.0" width="21.0" height="34.0" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="217.1" y="148.0" font-size="11" fill="#1e293b" text-anchor="middle">5</text>
<text x="235.6" y="140.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="700">합 28 ms → 35.7 FPS</text>
<text x="235.6" y="158.0" font-size="11" fill="#dc2626" text-anchor="start">추론 비중 29%</text>
<text x="20.0" y="206.0" font-size="11.5" fill="#1e293b" text-anchor="start">추론을 10배 빠르게 해도 프레임은 100 → 28 ms (3.6배) — 전처리 10 ms 가 새 1등 → 다음엔 전처리 · 그리기를 줄인다</text>
<text x="20.0" y="228.0" font-size="11.5" fill="#64748b" text-anchor="start">time_stages: perf_counter 를 조각마다 찍어 차이 × 1000 = ms · 영상 50프레임 (앞 5장 warm-up) 평균</text>
<text x="20.0" y="250.0" font-size="11.5" fill="#dc2626" text-anchor="start">⚠ 추론만 잰 FPS ≠ 파이프라인 FPS — 영상 읽기 · 저장(디스크)까지 들어간다 (6교시 성능표에 둘 다)</text>
