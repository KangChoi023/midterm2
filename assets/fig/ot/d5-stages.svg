<text x="519.5" y="78.0" font-size="11" fill="#1e293b" text-anchor="middle">5</text>
<text x="538.0" y="70.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="700">합 100 ms → 10.0 FPS</text>
<text x="538.0" y="88.0" font-size="11" fill="#dc2626" text-anchor="start">추론 비중 80%</text>
<text x="16.0" y="146.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">추론 8 ms</text>
