<text x="20.0" y="228.0" font-size="11.5" fill="#1e293b" text-anchor="start">        ③ 바꾼 뒤에도 결과는 같아야 한다 (allclose) — 빨라졌는데 답이 달라지면 소용없다</text>
<text x="20.0" y="254.0" font-size="11.5" fill="#64748b" text-anchor="start">providers 는 희망 목록 — 설치됨 [Azure, CPU] · 실제 사용 [CPU] → GPU 가 없으면 조용히 CPU 로, get_providers() 로 확인</text>
