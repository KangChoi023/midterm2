<rect x="468.0" y="44.0" width="212.0" height="60.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="574.0" y="69.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">③ 이름 · shape</text>
<text x="574.0" y="89.0" font-size="10.5" fill="#64748b" text-anchor="middle">get_tensor_name · mode</text>
<rect x="12.0" y="120.0" width="212.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="118.0" y="145.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">④ GPU 버퍼</text>
<text x="118.0" y="165.0" font-size="10.5" fill="#64748b" text-anchor="middle">torch.empty(…, device="cuda")</text>
<line x1="224.0" y1="150.0" x2="238.0" y2="150.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="240.0" y="120.0" width="212.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="346.0" y="145.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">⑤ 주소 · 실행</text>
<text x="346.0" y="165.0" font-size="10.5" fill="#64748b" text-anchor="middle">set_tensor_address · execute_async_v3</text>
<line x1="452.0" y1="150.0" x2="466.0" y2="150.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="468.0" y="120.0" width="212.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="574.0" y="145.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">⑥ 기다리기 · 꺼내기</text>
<text x="574.0" y="165.0" font-size="10.5" fill="#64748b" text-anchor="middle">synchronize → .cpu().numpy()</text>
<text x="20.0" y="216.0" font-size="11.5" fill="#1e293b" text-anchor="start">ORT 는 NumPy 를 받았지만 TensorRT 는 GPU 주소(data_ptr) 만 받는다 · trt_runner: 버퍼 · 주소는 한 번만</text>
<text x="20.0" y="238.0" font-size="11.5" fill="#dc2626" text-anchor="start">⚠ execute_async_v3 는 비동기 — synchronize 없이 재면 끝나기 전 시간이라 엄청 빠르게 보인다 · 입력은 float32</text>
