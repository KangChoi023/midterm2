<text x="118.0" y="181.0" font-size="12" fill="#1e293b" text-anchor="middle">(3, 224, 224)</text>
<text x="118.0" y="200.0" font-size="11" fill="#64748b" text-anchor="middle">HWC → CHW</text>
<line x1="224.0" y1="174.0" x2="238.0" y2="174.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="240.0" y="136.0" width="212.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="346.0" y="160.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">⑤ 배치 축</text>
<text x="346.0" y="181.0" font-size="12" fill="#1e293b" text-anchor="middle">(1, 3, 224, 224)</text>
<text x="346.0" y="200.0" font-size="11" fill="#64748b" text-anchor="middle">x[None] float32</text>
<line x1="452.0" y1="174.0" x2="466.0" y2="174.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="468.0" y="136.0" width="212.0" height="76.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="574.0" y="160.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">⑥ run · softmax</text>
<text x="574.0" y="181.0" font-size="12" fill="#1e293b" text-anchor="middle">(1000,) → top-5</text>
<text x="574.0" y="200.0" font-size="11" fill="#64748b" text-anchor="middle">exp(l − max) / 합</text>
<text x="20.0" y="238.0" font-size="11.5" fill="#1e293b" text-anchor="start">MEAN = [0.485, 0.456, 0.406] · STD = [0.229, 0.224, 0.225] (ImageNet 학습 때 값) — np.float32 로 만들어야 결과도 float32</text>
<text x="20.0" y="258.0" font-size="11.5" fill="#dc2626" text-anchor="start">⚠ reshape(3, 224, 224) 는 모양만 바꿈 — 축 순서는 transpose(2, 0, 1) · BGR 그대로 · 정규화 누락은 오류 없이 다른 답</text>
</svg>
