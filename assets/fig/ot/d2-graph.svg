<text x="20.0" y="280.0" font-size="11.5" fill="#1e293b" text-anchor="start">Conv 의 input = ['input', 'conv.weight', 'conv.bias'] — 데이터 1개 + initializer 이름 2개 · 바깥에서 넣는 것은 사진뿐</text>
