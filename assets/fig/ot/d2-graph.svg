<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="290" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">ONNX 파일 = 상자 안의 상자 — 화살표는 저장되지 않고 "이름이 같으면" 이어진다</text>
