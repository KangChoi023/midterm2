<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="230" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">왜 빨라졌나 — 엔진 인스펙터로 본 레이어 합치기 (DETAILED 로 빌드해야 보인다)</text>
<text x="20.0" y="56.0" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">ONNX 노드</text>
<rect x="110.0" y="40.0" width="56.0" height="28.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="138.0" y="59.0" font-size="11.5" fill="#1e293b" text-anchor="middle">Conv</text>
<rect x="172.0" y="40.0" width="86.0" height="28.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="215.0" y="59.0" font-size="11.5" fill="#1e293b" text-anchor="middle">HardSigmoid</text>
<rect x="264.0" y="40.0" width="56.0" height="28.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="292.0" y="59.0" font-size="11.5" fill="#1e293b" text-anchor="middle">Mul</text>
<rect x="326.0" y="40.0" width="56.0" height="28.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="354.0" y="59.0" font-size="11.5" fill="#1e293b" text-anchor="middle">Conv</text>
<rect x="388.0" y="40.0" width="56.0" height="28.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="416.0" y="59.0" font-size="11.5" fill="#1e293b" text-anchor="middle">Relu</text>
<rect x="450.0" y="40.0" width="56.0" height="28.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<text x="478.0" y="59.0" font-size="11.5" fill="#1e293b" text-anchor="middle">Add</text>
<text x="20.0" y="116.0" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">엔진 레이어</text>
<rect x="110.0" y="98.0" width="220.0" height="32.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="220.0" y="119.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Conv + HardSigmoid + Mul</text>
<rect x="336.0" y="98.0" width="140.0" height="32.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="406.0" y="119.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Conv + Relu + Add</text>
<rect x="482.0" y="98.0" width="100.0" height="32.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="532.0" y="119.0" font-size="11.5" fill="#1e293b" text-anchor="middle">Reformat</text>
<line x1="230.0" y1="70.0" x2="220.0" y2="96.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="430.0" y1="70.0" x2="406.0" y2="96.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="20.0" y="160.0" font-size="11.5" fill="#1e293b" text-anchor="start">레이어 이름의 " + " = 여러 ONNX 노드를 한 커널로 · Reformat = 데이터 배치(정밀도 · 레이아웃) 변환</text>
<text x="20.0" y="182.0" font-size="11.5" fill="#1e293b" text-anchor="start">빨라진 이유 ① 합치기 — 중간 결과의 메모리 왕복 ↓  ② 이 GPU 에서 재 보고 고른 커널  ③ FP16 (Tensor Core)</text>
<text x="20.0" y="206.0" font-size="11.5" fill="#dc2626" text-anchor="start">⚠ 레이어 수가 적다고 무조건 빠른 건 아니다 — 세 가지가 함께 작용하므로 결국 bench 로 확인 (그림의 묶음은 예시)</text>
