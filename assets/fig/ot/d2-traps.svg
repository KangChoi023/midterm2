<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="300" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">조용히 틀리는 export 3가지 — 더미 입력으로 "실행된 길" 만 녹화된다</text>
<text x="20.0" y="52.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">원인</text>
<text x="250.0" y="52.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">증상 (에러 없음!)</text>
<text x="500.0" y="52.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">고치기 → 새 노드</text>
<rect x="15.0" y="64.0" width="670.0" height="58.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
<text x="25.0" y="84.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">① 파이썬 if</text>
<text x="25.0" y="104.0" font-size="11" fill="#64748b" text-anchor="start">if x.mean() &gt; 0: x*2 else x-1</text>
<text x="250.0" y="84.0" font-size="11.5" fill="#1e293b" text-anchor="start">더미 ones → x*2 길만 녹화</text>
<text x="250.0" y="104.0" font-size="11" fill="#dc2626" text-anchor="start">음수 입력: ONNX [−6,−4,−2] ≠ 원래 [−4,−3,−2]</text>
<text x="500.0" y="84.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">torch.where(조건, x*2, x−1)</text>
<text x="500.0" y="104.0" font-size="11" fill="#64748b" text-anchor="start">→ Where 노드</text>
<rect x="15.0" y="130.0" width="670.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<text x="25.0" y="150.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">② NumPy · float()</text>
<text x="25.0" y="170.0" font-size="11" fill="#64748b" text-anchor="start">m = float(np.mean(x.numpy()))</text>
<text x="250.0" y="150.0" font-size="11.5" fill="#1e293b" text-anchor="start">더미 [5,5,5] → m = 5 상수</text>
<text x="250.0" y="170.0" font-size="11" fill="#dc2626" text-anchor="start">[1,2,3]: ONNX [−4,−3,−2] ≠ 원래 [−1,0,1]</text>
<text x="500.0" y="150.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">x − x.mean(dim=1, keepdim=True)</text>
<text x="500.0" y="170.0" font-size="11" fill="#64748b" text-anchor="start">→ ReduceMean 노드</text>
<rect x="15.0" y="196.0" width="670.0" height="58.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="25.0" y="216.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">③ 숫자로 쓴 크기</text>
<text x="25.0" y="236.0" font-size="11" fill="#64748b" text-anchor="start">x.view(1, −1)</text>
<text x="250.0" y="216.0" font-size="11.5" fill="#1e293b" text-anchor="start">dynamic 이어도 1 로 고정</text>
<text x="250.0" y="236.0" font-size="11" fill="#dc2626" text-anchor="start">배치 4 → (1, 64) — 실행 오류</text>
<text x="500.0" y="216.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">x.flatten(1) · view(x.size(0), −1)</text>
<text x="500.0" y="236.0" font-size="11" fill="#64748b" text-anchor="start">→ Flatten 노드</text>
<text x="20.0" y="280.0" font-size="11.5" fill="#1e293b" text-anchor="start">확인법: verify() 에 더미와 "다른" 입력(음수 · 다른 사진 · 배치 4) 을 넣고, TracerWarning 한 줄을 읽는다 — 더미 하나면 늘 ✅</text>
</svg>
