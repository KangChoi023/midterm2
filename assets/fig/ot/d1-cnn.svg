<text x="20.0" y="180.0" font-size="12" fill="#1e293b" text-anchor="start">파일 ≈ 433,890 × 4 B = 1.74 MB — 가중치의 99.6% 가 fc1 (Flatten 뒤 첫 Gemm)</text>
<text x="20.0" y="206.0" font-size="12" fill="#16a34a" text-anchor="start">전처리: (img.astype(float32) / 255)[None, None] → ORT 와 PyTorch 일치율 1.000 · 정확도 1.000 (100장)</text>
<text x="20.0" y="228.0" font-size="12" fill="#dc2626" text-anchor="start">/255 를 빼면? 오류 없이 정확도만 조용히 떨어진다 (1.00 → 0.92) — 가장 찾기 어려운 버그</text>
