<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="270" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">dynamic_axes — 축에 숫자 대신 이름을 붙여 "크기가 바뀔 수 있다" 고 약속</text>
<rect x="15.0" y="42.0" width="320.0" height="92.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="30.0" y="64.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">고정 (Day 1)</text>
<text x="30.0" y="88.0" font-size="12.5" fill="#1e293b" text-anchor="start">input [1, 1, 28, 28]</text>
<text x="30.0" y="112.0" font-size="12" fill="#dc2626" text-anchor="start">배치 4 → Got: 4 Expected: 1 ✘</text>
<rect x="365.0" y="42.0" width="320.0" height="92.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="380.0" y="64.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="700">dynamic_axes={"input": {0: "batch"}, …}</text>
<text x="380.0" y="88.0" font-size="12.5" fill="#1e293b" text-anchor="start">input ['batch', 1, 28, 28] → ['batch', 10]</text>
<text x="380.0" y="112.0" font-size="12" fill="#16a34a" text-anchor="start">배치 1 · 4 · 8 · 100 모두 ✔ (100장 정확도 1.0)</text>
<text x="20.0" y="162.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">높이 · 너비까지 열면? {0: "batch", 2: "height", 3: "width"} — 약속일 뿐, 모델이 못 받는 크기는 실행 중 오류</text>
<rect x="20.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="57.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle">32×32</text>
<rect x="104.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="141.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle">Conv 5×5</text>
<rect x="188.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="225.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle">28×28</text>
<rect x="272.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="309.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle">MaxPool</text>
<rect x="356.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="393.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle">14×14</text>
<rect x="440.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="477.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle">Flatten</text>
<rect x="524.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="561.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">5,880</text>
<rect x="608.0" y="178.0" width="74.0" height="30.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="645.0" y="198.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Gemm ✘</text>
<text x="20.0" y="234.0" font-size="11.5" fill="#64748b" text-anchor="start">Conv · Pool 은 어떤 크기든 되지만 fc1 은 정확히 30 × 12 × 12 = 4,320 개를 원한다 (32×32 면 30 × 14 × 14 = 5,880)</text>
<text x="20.0" y="254.0" font-size="11.5" fill="#dc2626" text-anchor="start">오류: GEMM: Dimension mismatch, W: {100,4320} K: 5880 — 열어도 되는 축은 모델이 정말 처리할 수 있는 축뿐</text>
