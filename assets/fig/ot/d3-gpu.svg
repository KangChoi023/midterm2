<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="210" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">GPU 실행 = 복사 → 계산 → 복사 — 계산이 빨라도 나르는 시간이 생긴다</text>
<rect x="20.0" y="50.0" width="180.0" height="70.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="110.0" y="78.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">CPU 메모리</text>
<text x="110.0" y="100.0" font-size="11.5" fill="#64748b" text-anchor="middle">NumPy 입력 · 출력</text>
<rect x="500.0" y="50.0" width="180.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="590.0" y="78.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">GPU (CUDA EP)</text>
<text x="590.0" y="100.0" font-size="11.5" fill="#64748b" text-anchor="middle">계산은 빠름</text>
<line x1="200.0" y1="70.0" x2="498.0" y2="70.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="349.0" y="62.0" font-size="12" fill="#64748b" text-anchor="middle">① 입력 복사 (Host → Device)</text>
<line x1="498.0" y1="104.0" x2="200.0" y2="104.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="350.0" y="122.0" font-size="12" fill="#64748b" text-anchor="middle">③ 결과 복사 (Device → Host)</text>
<text x="590.0" y="140.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">② 계산</text>
<text x="20.0" y="166.0" font-size="11.5" fill="#1e293b" text-anchor="start">배치 1: 계산이 작아 복사 · 첫 실행 준비(수백 ms) 비중이 크다 → 이득 작음 · 배치가 크면 계산이 커져 GPU 가 크게 유리</text>
<text x="20.0" y="188.0" font-size="11.5" fill="#64748b" text-anchor="start">이 환경(CPU 4코어): 배치 1 = 1.66 ms · 배치 32 = 20.33 ms (장당 0.64 ms) — GPU 결과는 CPU 와 차이 &lt; 1e-3 이어야</text>
</svg>
