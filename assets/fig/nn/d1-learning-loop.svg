<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="270" fill="#fff"/>
<rect x="230.0" y="20.0" width="180.0" height="56.0" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="320.0" y="45.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">모델</text>
<text x="320.0" y="63.0" font-size="12.5" fill="#64748b" text-anchor="middle">y = f(x; θ)</text>
<rect x="440.0" y="110.0" width="180.0" height="56.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="530.0" y="135.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">손실</text>
<text x="530.0" y="153.0" font-size="12.5" fill="#64748b" text-anchor="middle">L(y, 정답)</text>
<rect x="230.0" y="195.0" width="180.0" height="56.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="320.0" y="220.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">기울기</text>
<text x="320.0" y="238.0" font-size="12.5" fill="#64748b" text-anchor="middle">∇L = ∂L/∂θ</text>
<rect x="20.0" y="110.0" width="180.0" height="56.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="110.0" y="135.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">갱신</text>
<text x="110.0" y="153.0" font-size="12.5" fill="#64748b" text-anchor="middle">θ ← θ − η·∇L</text>
<line x1="410.0" y1="60.0" x2="470.0" y2="108.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="470.0" y1="168.0" x2="412.0" y2="210.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="228.0" y1="212.0" x2="170.0" y2="168.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="170.0" y1="108.0" x2="228.0" y2="62.0" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="320.0" y="128.0" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">반복</text>
<text x="320.0" y="150.0" font-size="12.5" fill="#64748b" text-anchor="middle">(손실이 더 안 줄 때까지)</text>
</svg>
