<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="560" height="220" fill="#fff"/>
<line x1="60.0" y1="180.0" x2="360.0" y2="180.0" stroke="#0284c7" stroke-width="3" marker-end="url(#arr)"/>
<text x="366.0" y="185.0" font-size="15" fill="#0284c7" text-anchor="start" font-weight="700">a</text>
<line x1="60.0" y1="180.0" x2="260.0" y2="50.0" stroke="#d97706" stroke-width="3" marker-end="url(#arr)"/>
<text x="268.0" y="46.0" font-size="15" fill="#d97706" text-anchor="start" font-weight="700">b</text>
<line x1="260.0" y1="50.0" x2="260.0" y2="180.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="60.0" y1="194.0" x2="260.0" y2="194.0" stroke="#16a34a" stroke-width="4"/>
<text x="160.0" y="214.0" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">‖b‖ cos θ  (b 의 그림자)</text>
<text x="95.0" y="168.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">θ</text>
<text x="380.0" y="70.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">a · b = ‖a‖ × ‖b‖ cos θ</text>
<text x="380.0" y="100.0" font-size="13" fill="#64748b" text-anchor="start">같은 방향 → 크다 (cos 1)</text>
<text x="380.0" y="122.0" font-size="13" fill="#64748b" text-anchor="start">수직 → 0 (cos 0)</text>
<text x="380.0" y="144.0" font-size="13" fill="#64748b" text-anchor="start">반대 방향 → 음수 (cos −1)</text>
</svg>
