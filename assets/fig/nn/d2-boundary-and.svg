<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14">
  <rect width="560" height="300" fill="#fff"/>
  <!-- 좌표: 원점 (70,250), 1 = 160px -->
  <polygon points="70,26 300,26 300,250 294,250" fill="#dcfce7"/>
  <line x1="70" y1="250" x2="300" y2="250" stroke="#334155" stroke-width="1.5"/><line x1="70" y1="250" x2="70" y2="20" stroke="#334155" stroke-width="1.5"/>
  <text x="304" y="255" fill="#334155">x₁</text><text x="62" y="16" fill="#334155">x₂</text>
  <text x="70" y="270" text-anchor="middle" fill="#64748b">0</text><text x="230" y="270" text-anchor="middle" fill="#64748b">1</text>
  <text x="58" y="254" text-anchor="end" fill="#64748b">0</text><text x="58" y="94" text-anchor="end" fill="#64748b">1</text>
  <!-- 결정 경계 x1 + x2 = 1.4 : (0.4,1)->(134,90)?  x1=0.4,x2=1 → (134,90); x1=1,x2=0.4 → (230,186); 연장 -->
  <line x1="70" y1="26" x2="294" y2="250" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="70" cy="250" r="9" fill="#fff" stroke="#334155" stroke-width="2"/>
  <circle cx="70" cy="90" r="9" fill="#fff" stroke="#334155" stroke-width="2"/>
  <circle cx="230" cy="250" r="9" fill="#fff" stroke="#334155" stroke-width="2"/>
  <circle cx="230" cy="90" r="9" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <text x="80" y="112" fill="#334155">(0,1)</text><text x="80" y="128" fill="#334155">s=−0.2</text>
  <text x="230" y="70" text-anchor="middle" fill="#14532d" font-weight="700">(1,1) s=+0.3</text>
  <text x="80" y="228" fill="#334155">(0,0) s=−0.7</text>
  <text x="218" y="244" text-anchor="end" fill="#334155">(1,0) s=−0.2</text>
  <!-- 범례 -->
  <text x="330" y="60" fill="#dc2626" font-weight="700">결정 경계</text>
  <text x="330" y="80" fill="#334155">0.5x₁ + 0.5x₂ − 0.7 = 0</text>
  <text x="330" y="98" fill="#334155">(x₁ + x₂ = 1.4 인 직선)</text>
  <rect x="330" y="122" width="16" height="16" fill="#dcfce7" stroke="#16a34a"/><text x="354" y="135" fill="#334155">s &gt; 0 쪽 → 출력 1</text>
  <circle cx="338" cy="164" r="7" fill="#16a34a"/><text x="354" y="169" fill="#334155">출력 1</text>
  <circle cx="338" cy="190" r="7" fill="#fff" stroke="#334155" stroke-width="2"/><text x="354" y="195" fill="#334155">출력 0</text>
  <text x="330" y="232" fill="#64748b" font-size="13">W 는 직선의 기울기(방향),</text>
  <text x="330" y="250" fill="#64748b" font-size="13">b 는 직선의 위치를 정한다</text>
</svg>
